name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install switch2 ruff mypy pytest pytest-asyncio pytest-homeassistant-custom-component
      - name: Ruff check
        run: ruff check custom_components tests
      - name: Ruff format
        run: ruff format --check custom_components tests
      - name: Mypy
        run: mypy custom_components/switch2 tests
      - name: Pytest
        run: pytest
